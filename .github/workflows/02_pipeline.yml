
# Generated by ChatGPT
# INTENTIONALLY VULNERABLE - workshop use only

name: Auto Assign Reviewers - Secret

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Available to every step in the workflow

jobs:
  assign-reviewers:
    name: "02: Assign PR Reviewers"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

          # Intentionally disable checkout protection
          allow-unsafe-pr-checkout: true

      - name: Assign reviewers
        run: node ./scripts/assign-reviewers.js
        env:
          REPO_SECRET_FLAG: ${{ secrets.REPO_SECRET_FLAG }}